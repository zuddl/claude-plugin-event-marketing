<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{name}} — {{event_name}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 1200px;
    background: #0B1220;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .card {
    width: 1200px;
    height: 1200px;
    box-sizing: border-box;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(circle at 20% 10%, rgba(120, 90, 255, 0.35), transparent 55%),
      radial-gradient(circle at 90% 95%, rgba(255, 110, 80, 0.25), transparent 50%),
      linear-gradient(180deg, #0B1220 0%, #0B1220 100%);
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 22px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
  }

  .event-date {
    font-size: 22px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
  }

  .body {
    display: flex;
    align-items: center;
    gap: 64px;
    flex: 1;
    margin-top: 40px;
  }

  .headshot {
    width: 420px;
    height: 420px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid rgba(255, 255, 255, 0.9);
    flex-shrink: 0;
    background: #1a2238;
  }

  .meta {
    flex: 1;
    min-width: 0;
  }

  .name {
    font-size: 76px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 24px 0;
  }

  .title {
    font-size: 32px;
    font-weight: 500;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.85);
    margin: 0;
  }

  .company {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.3;
    margin-top: 6px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 1px solid rgba(255, 255, 255, 0.18);
    padding-top: 36px;
  }

  .event-name {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .event-location {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 8px;
  }

  .hashtag {
    font-size: 24px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="eyebrow">Speaker Spotlight</div>
      <div class="event-date">{{event_date}}</div>
    </div>

    <div class="body">
      <img class="headshot" src="{{headshot}}" alt="{{name}}" />
      <div class="meta">
        <h1 class="name">{{name}}</h1>
        <p class="title">{{title}}</p>
        <p class="company">{{company}}</p>
      </div>
    </div>

    <div class="footer">
      <div>
        <div class="event-name">{{event_name}}</div>
        <div class="event-location">{{event_location}}</div>
      </div>
      <div class="hashtag">{{event_hashtag}}</div>
    </div>
  </div>
</body>
</html>
