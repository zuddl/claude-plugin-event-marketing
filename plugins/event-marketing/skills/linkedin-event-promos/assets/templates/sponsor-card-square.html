<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{name}} — Sponsor of {{event_name}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 1200px;
    background: #F6F4EE;
    color: #0B1220;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .card {
    width: 1200px;
    height: 1200px;
    box-sizing: border-box;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(circle at 80% 10%, rgba(255, 200, 120, 0.45), transparent 55%),
      radial-gradient(circle at 10% 90%, rgba(120, 140, 255, 0.25), transparent 50%),
      #F6F4EE;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 22px;
    font-weight: 600;
    color: rgba(11, 18, 32, 0.6);
  }

  .tier-strap {
    font-size: 22px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    padding: 12px 24px;
    border-radius: 999px;
    background: #0B1220;
    color: #fff;
  }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 48px;
  }

  .logo-wrap {
    width: 760px;
    height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(11, 18, 32, 0.08);
    padding: 48px;
    box-sizing: border-box;
  }

  .logo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .name {
    font-size: 60px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .thank-you {
    font-size: 28px;
    font-weight: 500;
    color: rgba(11, 18, 32, 0.75);
    margin: -24px 0 0 0;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 1px solid rgba(11, 18, 32, 0.15);
    padding-top: 36px;
  }

  .event-name {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .event-location {
    font-size: 22px;
    font-weight: 500;
    color: rgba(11, 18, 32, 0.65);
    margin-top: 8px;
  }

  .hashtag-block {
    text-align: right;
  }

  .event-date {
    font-size: 22px;
    font-weight: 600;
    color: rgba(11, 18, 32, 0.7);
    margin-bottom: 8px;
  }

  .hashtag {
    font-size: 24px;
    font-weight: 700;
    color: #0B1220;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="eyebrow">Proud Sponsor</div>
      <div class="tier-strap">{{tier}}</div>
    </div>

    <div class="body">
      <p class="thank-you">Thank you to our sponsor</p>
      <div class="logo-wrap">
        <img class="logo" src="{{logo}}" alt="{{name}}" />
      </div>
      <h1 class="name">{{name}}</h1>
    </div>

    <div class="footer">
      <div>
        <div class="event-name">{{event_name}}</div>
        <div class="event-location">{{event_location}}</div>
      </div>
      <div class="hashtag-block">
        <div class="event-date">{{event_date}}</div>
        <div class="hashtag">{{event_hashtag}}</div>
      </div>
    </div>
  </div>
</body>
</html>
